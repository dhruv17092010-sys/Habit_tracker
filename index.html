<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atomic Ledger — Habit Builder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --paper:#EDF1EA;
  --paper-deep:#E1E8DC;
  --line: rgba(31,42,68,0.09);
  --line-strong: rgba(31,42,68,0.16);
  --ink:#1F2A44;
  --ink-soft:#5B6577;
  --ink-faint:#9AA4AC;
  --amber:#DE9F35;
  --amber-deep:#B87F22;
  --amber-tint: rgba(222,159,53,0.16);
  --sage:#6E8B74;
  --sage-tint: rgba(110,139,116,0.16);
  --rust:#C1533A;
  --rust-tint: rgba(193,83,58,0.13);
  --card:#FBFCF8;
  --white:#FFFFFF;
  --shadow-sm: 0 1px 2px rgba(31,42,68,0.06);
  --shadow-md: 0 8px 24px rgba(31,42,68,0.10);
  --radius: 12px;
  --radius-sm: 7px;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{ font-family:'Fraunces', Georgia, serif; margin:0; }
.mono{ font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace; }
button{ font-family:inherit; }
::selection{ background:var(--amber-tint); }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

.app{ display:flex; min-height:100vh; }

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:290px; flex-shrink:0;
  background:var(--paper-deep);
  border-right:1px solid var(--line-strong);
  display:flex; flex-direction:column;
  padding:28px 20px;
}
.brand{ margin-bottom:26px; }
.brand .eyebrow{
  font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--amber-deep); font-weight:600; margin-bottom:6px;
}
.brand h1{ font-size:26px; font-weight:600; letter-spacing:-0.01em; }
.brand .tag{ color:var(--ink-soft); font-size:12.5px; margin-top:4px; line-height:1.5; }

.btn{
  font-size:13.5px; font-weight:600; border-radius:var(--radius-sm);
  padding:10px 14px; cursor:pointer; border:1px solid var(--line-strong);
  background:var(--white); color:var(--ink); transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:hover{ box-shadow:var(--shadow-sm); transform:translateY(-1px); }
.btn:active{ transform:translateY(0); }
.btn-primary{ background:var(--ink); color:var(--white); border-color:var(--ink); }
.btn-primary:hover{ background:#2b3a5c; }
.btn-ghost{ background:transparent; border-color:transparent; }
.btn-ghost:hover{ background:rgba(31,42,68,0.06); box-shadow:none; transform:none; }
.btn-danger{ color:var(--rust); }
.btn-block{ width:100%; }
.btn-sm{ padding:6px 10px; font-size:12.5px; }

.new-habit-btn{ margin-bottom:20px; }

.habit-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; overflow-y:auto; flex:1; }
.habit-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 10px; border-radius:var(--radius-sm); cursor:pointer;
  border:1px solid transparent; position:relative;
}
.habit-item:hover{ background:rgba(255,255,255,0.55); }
.habit-item.active{ background:var(--white); border-color:var(--line-strong); box-shadow:var(--shadow-sm); }
.habit-dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08); }
.habit-item-body{ flex:1; min-width:0; }
.habit-item-name{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.habit-item-streak{ font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:4px; }
.habit-item-del{ opacity:0; background:none; border:none; cursor:pointer; color:var(--ink-faint); padding:4px; border-radius:5px; }
.habit-item:hover .habit-item-del{ opacity:1; }
.habit-item-del:hover{ color:var(--rust); background:var(--rust-tint); }

.sidebar-footer{ margin-top:18px; padding-top:16px; border-top:1px solid var(--line-strong); }
.storage-pill{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-soft); margin-bottom:10px; }
.storage-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.storage-dot.ok{ background:var(--sage); }
.storage-dot.warn{ background:var(--amber); }
.io-row{ display:flex; gap:6px; }
.io-row .btn{ flex:1; }

/* ---------- MAIN ---------- */
.main{ flex:1; min-width:0; padding:34px 42px 60px; overflow-y:auto; }
.container{ max-width:920px; margin:0 auto; }

.empty-state{
  margin-top:8vh; text-align:center; max-width:520px; margin-left:auto; margin-right:auto;
}
.empty-state .eyebrow{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--amber-deep); font-weight:700; }
.empty-state h2{ font-size:32px; margin:10px 0 12px; }
.empty-state p{ color:var(--ink-soft); line-height:1.6; font-size:14.5px; margin-bottom:22px;}
.laws-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:26px 0; text-align:left; }
.law-card{ background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius-sm); padding:12px 14px; }
.law-card .num{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber-deep); font-weight:600; }
.law-card h4{ font-family:'Fraunces',serif; font-size:15px; margin:3px 0 4px; }
.law-card p{ font-size:12px; color:var(--ink-soft); margin:0; line-height:1.5; }

/* ---------- HOME / BRANDING SCREEN ---------- */
.home-hero{
  display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap;
  background:var(--card); border:1px solid var(--line-strong); border-radius:16px;
  padding:26px 30px; margin-bottom:28px; box-shadow:var(--shadow-sm);
}
.home-brand{ display:flex; align-items:center; gap:16px; min-width:0; }
.home-logo-img{ width:52px; height:52px; border-radius:14px; object-fit:cover; flex-shrink:0; display:block; }
.home-logo-fallback{
  display:none; width:52px; height:52px; border-radius:14px; flex-shrink:0;
  background:linear-gradient(135deg, var(--ink), #3B6E8F); color:var(--white);
  align-items:center; justify-content:center; font-size:24px; box-shadow:var(--shadow-sm);
}
.home-eyebrow{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--amber-deep); font-weight:700; }
.home-title{ font-size:28px; font-weight:600; letter-spacing:-0.01em; margin:2px 0 4px; }
.home-tagline{ font-size:13px; color:var(--ink-soft); font-style:italic; }
.home-hero-actions{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; flex-shrink:0; }
.home-cta{ font-size:14.5px; padding:12px 20px; box-shadow:var(--shadow-sm); }
.home-explore{
  font-size:12.5px; color:var(--ink-soft); text-decoration:none; border:1px solid var(--line-strong);
  border-radius:var(--radius-sm); padding:8px 14px; background:var(--white);
}
.home-explore:hover{ color:var(--ink); border-color:var(--line-strong); }

.home-carousel-section{ margin-bottom:30px; }
.home-carousel-heading{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.home-carousel-heading h2{ font-size:19px; font-weight:600; }
.carousel-arrows{ display:flex; gap:6px; }
.carousel-arrow{
  width:30px; height:30px; border-radius:50%; border:1px solid var(--line-strong); background:var(--white);
  cursor:pointer; font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center; color:var(--ink);
}
.carousel-arrow:hover{ background:var(--paper-deep); }

.carousel-viewport{ overflow:hidden; border-radius:16px; cursor:grab; touch-action:pan-y; user-select:none; }
.carousel-viewport:active{ cursor:grabbing; }
.carousel-track{ display:flex; }
.carousel-card{
  flex:0 0 100%; max-width:100%; box-sizing:border-box;
  background:var(--card); border:1px solid var(--line-strong); border-radius:16px;
  padding:22px 24px; cursor:pointer; min-height:168px; display:flex; flex-direction:column; justify-content:space-between; gap:14px;
}
.home-card-top{ display:flex; align-items:center; gap:12px; }
.home-card-icon{ width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08); }
.home-card-name{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.home-card-status{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; padding:4px 10px; border-radius:20px; flex-shrink:0; }
.home-card-status.complete{ background:var(--amber-tint); color:var(--amber-deep); }
.home-card-status.partial{ background:var(--sage-tint); color:var(--sage); }
.home-card-status.pending{ background:var(--paper-deep); color:var(--ink-soft); }
.home-card-status.rest{ background:var(--line); color:var(--ink-faint); }
.home-card-metrics{ display:flex; gap:22px; }
.home-card-metric-num{ font-family:'Fraunces',serif; font-size:24px; font-weight:600; line-height:1; }
.home-card-metric-lbl{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px; }
.home-card-milestone{ font-size:11.5px; color:var(--ink-soft); }
.home-card-milestone-label{ font-weight:600; color:var(--ink); margin-bottom:6px; font-size:12.5px; }
.home-card-milestone-bar{ height:7px; background:var(--paper-deep); border-radius:5px; overflow:hidden; margin-bottom:5px; }
.home-card-milestone-fill{ height:100%; background:linear-gradient(90deg, var(--sage), var(--amber)); border-radius:5px; min-width:2px; }
.home-card-milestone-meta{ font-family:'IBM Plex Mono',monospace; font-size:11px; }
.home-card-milestone-empty a{ color:var(--ink); font-weight:600; cursor:pointer; text-decoration:underline; }

.home-onboard-card{ align-items:center; text-align:center; padding:34px 26px; cursor:default; }
.home-onboard-icon{ font-size:36px; margin-bottom:4px; }
.home-onboard-card h3{ font-family:'Fraunces',serif; font-size:20px; margin-bottom:4px; }
.home-onboard-card p{ font-size:13px; color:var(--ink-soft); line-height:1.55; max-width:380px; margin:0 auto 6px; }

.carousel-dots{ display:flex; justify-content:center; gap:7px; margin-top:14px; }
.carousel-dot{ width:8px; height:8px; border-radius:50%; border:none; background:var(--line-strong); cursor:pointer; padding:0; }
.carousel-dot.active{ background:var(--ink); width:20px; border-radius:5px; transition:width .2s ease; }

.home-laws{ margin-top:6px; }
.home-laws-title{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--amber-deep); font-weight:700; margin-bottom:12px; }

.setup-modal{ max-width:640px; }
.setup-modal .form-card{ padding:0; border:none; background:transparent; }

@media (max-width: 880px){
  .home-hero{ flex-direction:column; align-items:stretch; padding:20px; }
  .home-hero-actions{ align-items:stretch; }
  .home-hero-actions .btn, .home-explore{ text-align:center; }
  .home-logo-img, .home-logo-fallback{ width:44px; height:44px; }
  .home-title{ font-size:23px; }
}
@media (max-width: 560px){
  .carousel-card{ padding:18px 16px; min-height:150px; }
  .home-card-metric-num{ font-size:20px; }
  .home-card-name{ font-size:16px; }
}

/* Habit header */
.habit-header{
  display:flex; justify-content:space-between; align-items:flex-start; gap:20px;
  margin-bottom:22px; padding-bottom:20px; border-bottom:1px solid var(--line-strong);
}
.habit-header .swatch{ width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08); }
.habit-title-row{ display:flex; gap:12px; align-items:flex-start; }
.habit-header h2{ font-size:26px; letter-spacing:-0.01em; }
.habit-header .goal{ color:var(--sage); font-size:13px; font-weight:600; margin-top:5px; }
.habit-header .goal::before{ content:"→ "; }
.habit-header-actions{ display:flex; gap:8px; flex-shrink:0; }

.tabs{ display:flex; gap:4px; margin-bottom:22px; border-bottom:1px solid var(--line-strong); }
.tab-btn{
  background:none; border:none; padding:9px 4px; margin-right:22px; font-size:13.5px; font-weight:600;
  color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab-btn.active{ color:var(--ink); border-bottom-color:var(--amber); }

/* Chain */
.chain-panel{ display:flex; align-items:center; justify-content:space-between; gap:20px; background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius); padding:16px 20px; margin-bottom:22px; }
.chain-stats{ display:flex; gap:26px; }
.chain-stat .num{ font-family:'Fraunces',serif; font-size:24px; font-weight:600; line-height:1; }
.chain-stat .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin-top:4px; }
.chain-row{ display:flex; align-items:center; }
.chain-link{
  width:16px; height:16px; border-radius:50%; border:2px solid var(--ink-faint);
  margin-right:-5px; background:transparent; animation:linkIn .28s ease both;
}
.chain-link:nth-child(even){ transform:translateY(4px); }
.chain-link.filled{ border-color:var(--amber-deep); background:var(--amber); box-shadow:0 0 0 2px var(--card); }
.chain-more{ margin-left:10px; font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); }
@keyframes linkIn{ from{ transform:scale(0); opacity:0;} to{ transform:scale(1); opacity:1;} }

/* Calendar */
.cal-toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
.cal-nav{ display:flex; align-items:center; gap:8px; }
.cal-nav .label{ font-family:'Fraunces',serif; font-size:17px; min-width:170px; text-align:center; }
.view-toggle{ display:flex; background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius-sm); overflow:hidden; }
.view-toggle button{ border:none; background:none; padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft); }
.view-toggle button.active{ background:var(--ink); color:var(--white); }

.weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:6px; }
.weekday-row div{ text-align:center; font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-soft); font-weight:600; }
.month-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
.day-cell{
  background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius-sm);
  min-height:78px; padding:8px; cursor:pointer; display:flex; flex-direction:column; justify-content:space-between;
  transition:box-shadow .12s ease, transform .12s ease;
}
.day-cell:hover{ box-shadow:var(--shadow-sm); transform:translateY(-1px); }
.day-cell.muted{ opacity:0.38; }
.day-cell.today{ border-color:var(--ink); box-shadow:0 0 0 1px var(--ink); }
.day-cell.future{ border-style:dashed; }
.day-cell.complete{ background:var(--amber-tint); border-color:var(--amber-deep); }
.day-cell.partial{ background:var(--sage-tint); }
.day-cell.before-start{ opacity:0.4; }
.day-num{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; }
.day-frac{ font-size:10.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; align-self:flex-end; }

.week-strip{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
.week-card{ background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:8px; min-height:200px; }
.week-card.today{ border-color:var(--ink); box-shadow:0 0 0 1px var(--ink); }
.week-card .wd{ font-size:10.5px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.06em; font-weight:700; }
.week-card .wdate{ font-family:'Fraunces',serif; font-size:19px; margin-bottom:4px; }
.week-action-row{ font-size:12px; display:flex; align-items:center; gap:6px; }
.week-action-row label{ display:flex; align-items:center; gap:6px; flex:1; cursor:pointer; }
.week-action-row input[type=number]{ width:52px; padding:3px 5px; border-radius:5px; border:1px solid var(--line-strong); font-family:'IBM Plex Mono',monospace; font-size:12px; }
.week-action-row input[type=text]{ width:100%; padding:3px 6px; border-radius:5px; border:1px solid var(--line-strong); font-size:12px; }
.week-unit{ color:var(--ink-faint); font-size:10.5px; }
input[type=checkbox]{ accent-color:var(--ink); width:15px; height:15px; }

.empty-actions-hint{ font-size:12px; color:var(--ink-soft); background:var(--card); border:1px dashed var(--line-strong); border-radius:var(--radius-sm); padding:14px; text-align:center; }
.empty-actions-hint a{ color:var(--ink); font-weight:600; cursor:pointer; text-decoration:underline; }

/* Modal */
.overlay{ position:fixed; inset:0; background:rgba(31,42,68,0.35); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modal{ background:var(--white); border-radius:var(--radius); max-width:440px; width:100%; padding:24px; box-shadow:var(--shadow-md); max-height:86vh; overflow-y:auto; }
.modal h3{ font-size:19px; margin-bottom:2px; }
.modal .sub{ font-size:12px; color:var(--ink-soft); margin-bottom:16px; }
.action-log-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.action-log-row:last-of-type{ border-bottom:none; }
.action-log-row label{ display:flex; align-items:center; gap:9px; flex:1; font-size:13.5px; cursor:pointer; }
.stepper{ display:flex; align-items:center; gap:6px; }
.stepper button{ width:24px; height:24px; border-radius:6px; border:1px solid var(--line-strong); background:var(--card); cursor:pointer; font-size:14px; line-height:1; }
.stepper input{ width:48px; text-align:center; padding:4px; border-radius:5px; border:1px solid var(--line-strong); font-family:'IBM Plex Mono',monospace; }
.modal-actions{ display:flex; gap:8px; margin-top:18px; }
.modal-close{ position:absolute; }

/* Setup form */
.form-card{ background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius); padding:26px 28px; }
.form-section-title{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--amber-deep); font-weight:700; margin:22px 0 10px; }
.form-section-title:first-child{ margin-top:0; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; }
.field .hint{ font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; }
.field input[type=text], .field textarea, .field select{
  width:100%; padding:9px 11px; border:1px solid var(--line-strong); border-radius:var(--radius-sm);
  font-family:inherit; font-size:13.5px; background:var(--white); color:var(--ink);
}
.field textarea{ resize:vertical; min-height:52px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.swatches{ display:flex; gap:8px; flex-wrap:wrap; }
.swatch-opt{ width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,0.1); }
.swatch-opt.selected{ border-color:var(--ink); }
.icon-opts{ display:flex; gap:6px; flex-wrap:wrap; }
.icon-opt{ width:32px; height:32px; border-radius:8px; border:1px solid var(--line-strong); background:var(--white); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; }
.icon-opt.selected{ border-color:var(--ink); background:var(--amber-tint); }
details.laws-collapse summary{ cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:14px; }
.action-row{ display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--white); border:1px solid var(--line-strong); border-radius:var(--radius-sm); margin-bottom:7px; }
.action-row .a-name{ font-weight:600; font-size:13px; flex:1; }
.action-row .a-type{ font-size:10.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; padding:2px 7px; background:var(--paper); border-radius:5px; }
.identity-tag{ font-size:9px; text-transform:uppercase; letter-spacing:0.05em; color:var(--amber-deep); background:var(--amber-tint); padding:1px 6px; border-radius:8px; margin-left:4px; font-weight:700; }
.action-add-row{ display:grid; grid-template-columns:1.6fr 1fr 1fr 1fr auto; gap:8px; align-items:end; margin-top:10px; }
.action-add-row .field{ margin-bottom:0; }
.form-footer{ display:flex; gap:10px; margin-top:24px; }

/* Report */
.stat-cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
.stat-card{ background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius); padding:16px; }
.stat-card .num{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; }
.stat-card .lbl{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px; }
.chart-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.chart-card{ background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius); padding:18px; grid-column:span 1; }
.chart-card.full{ grid-column:span 2; }
.chart-card h4{ font-size:14px; margin-bottom:2px; }
.chart-card .chart-sub{ font-size:11.5px; color:var(--ink-soft); margin-bottom:12px; }
.report-empty{ font-size:12.5px; color:var(--ink-soft); text-align:center; padding:30px 10px; }
select.chart-select{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:4px 8px; border-radius:6px; border:1px solid var(--line-strong); background:var(--white); }

/* Pure CSS/SVG charts (no external deps) */
.donut-wrap{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
.donut{ width:132px; height:132px; border-radius:50%; position:relative; flex-shrink:0; }
.donut-hole{ position:absolute; inset:20px; background:var(--card); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.donut-total{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; line-height:1; }
.donut-total-lbl{ font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }
.donut-legend{ display:flex; flex-direction:column; gap:8px; font-size:12.5px; }
.donut-legend .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:7px; }
.bar-chart{ display:flex; justify-content:space-between; align-items:flex-end; height:180px; gap:6px; }
.bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.bar-track{ width:100%; max-width:26px; height:132px; background:var(--paper-deep); border-radius:6px; display:flex; align-items:flex-end; overflow:hidden; }
.bar-fill{ width:100%; background:linear-gradient(180deg, var(--amber), var(--amber-deep)); border-radius:6px 6px 0 0; transition:height .3s ease; min-height:2px; }
.bar-lbl{ font-size:10px; color:var(--ink-soft); margin-top:6px; font-weight:600; }
.bar-val{ font-size:9px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; }
.line-chart-wrap svg{ width:100%; height:auto; display:block; }
.trend-peak{ font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
.line-path{ transition: stroke-dashoffset 1.15s cubic-bezier(.4,0,.2,1); }
.line-area{ opacity:0; transition: opacity .6s ease .5s; }
.line-area.in{ opacity:1; }
.line-dot{ opacity:0; transition: opacity .3s ease; }
.line-dot.in{ opacity:1; }

/* Perfection gauge */
.gauge-toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
.gauge-body{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
.gauge-wrap{ position:relative; width:132px; height:132px; flex-shrink:0; }
.gauge-svg{ width:132px; height:132px; transform:rotate(-90deg); }
.gauge-track{ fill:none; stroke:var(--paper-deep); stroke-width:11; }
.gauge-fill{ fill:none; stroke:var(--amber); stroke-width:11; stroke-linecap:round; transition: stroke-dashoffset 1.15s cubic-bezier(.4,0,.2,1); }
.gauge-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
.gauge-percent{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; line-height:1; }
.gauge-sub{ font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; margin-top:3px; }
.gauge-legend{ display:flex; flex-direction:column; gap:8px; font-size:12.5px; }
.gauge-legend .frac{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
.gauge-legend .row{ display:flex; align-items:center; gap:7px; }
.gauge-legend .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

/* Bar rise animation (JS sets height 0 -> target on mount) */
.bar-fill{ transition: height .85s cubic-bezier(.4,0,.2,1); }

/* Milestones */
.milestones-wrap{ display:flex; flex-direction:column; gap:12px; }
.milestone-card{ background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius); padding:14px 16px; }
.milestone-card.achieved{ border-color:var(--amber-deep); background:var(--amber-tint); }
.milestone-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
.milestone-label{ font-family:'Fraunces',serif; font-size:15px; font-weight:600; }
.milestone-bar{ height:8px; background:var(--paper-deep); border-radius:5px; overflow:hidden; }
.milestone-bar-fill{ height:100%; background:linear-gradient(90deg, var(--sage), var(--amber)); border-radius:5px; transition:width .3s ease; min-width:2px; }
.milestone-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; font-family:'IBM Plex Mono',monospace; }
.record-card{ display:flex; flex-direction:column; }
.records-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
.milestones-divider{ margin:26px 0 14px; padding-top:18px; border-top:1px solid var(--line-strong); }

/* Schedule picker */
.weekday-picker{ display:flex; gap:6px; flex-wrap:wrap; }
.wd-chip{ width:38px; height:34px; border-radius:8px; border:1px solid var(--line-strong); background:var(--white); cursor:pointer; font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); user-select:none; }
.wd-chip.selected{ border-color:var(--ink); background:var(--ink); color:var(--white); }
.schedule-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; }

/* Off-schedule (rest) day styling */
.day-cell.off-schedule{ background:repeating-linear-gradient(135deg, var(--paper) 0px, var(--paper) 6px, var(--paper-deep) 6px, var(--paper-deep) 12px); opacity:0.62; }
.day-cell.off-schedule .day-frac{ font-style:italic; }
.week-card.off-schedule{ opacity:0.62; }
.rest-badge{ font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); font-weight:700; }

/* ---------- Celebration ---------- */
.celebrate-overlay{
  position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
  background:rgba(31,42,68,0.30); padding:20px; animation:celebBgIn .18s ease both;
}
@keyframes celebBgIn{ from{ opacity:0; } to{ opacity:1; } }
.celebrate-card{
  position:relative; background:var(--white); border-radius:16px; padding:34px 30px 26px;
  max-width:340px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(31,42,68,0.28);
  overflow:hidden; animation:celebPop .42s cubic-bezier(.26,1.4,.44,1) both;
}
.celebrate-card.leaving{ animation:celebOut .2s ease both; }
@keyframes celebPop{ 0%{ transform:scale(.55) translateY(10px); opacity:0; } 60%{ transform:scale(1.04); opacity:1; } 100%{ transform:scale(1); opacity:1; } }
@keyframes celebOut{ from{ transform:scale(1); opacity:1; } to{ transform:scale(.9); opacity:0; } }
.celebrate-icon{ font-size:44px; line-height:1; margin-bottom:10px; animation:celebIconBob 1.1s ease-in-out infinite; }
@keyframes celebIconBob{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-6px) rotate(-4deg); } }
.celebrate-title{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin-bottom:4px; }
.celebrate-detail{ font-size:13px; color:var(--ink-soft); margin-bottom:18px; line-height:1.5; }
.celebrate-card .btn{ min-width:110px; }
.confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.confetto{
  position:absolute; top:46%; left:50%; width:7px; height:11px;
  background:var(--amber); opacity:0;
  animation:confettoFly .95s ease-out both;
  animation-delay:calc(var(--i) * 18ms);
}
.confetto.c0{ background:var(--amber); }
.confetto.c1{ background:var(--sage); }
.confetto.c2{ background:var(--rust); }
.confetto.c3{ background:var(--ink); }
.confetto.c4{ background:var(--amber-deep); }
.confetto.c5{ background:#3B6E8F; }
@keyframes confettoFly{
  0%{ opacity:1; transform:translate(-50%,-50%) rotate(0deg) translateY(0) scale(1); }
  100%{ opacity:0; transform:translate(calc(-50% + (var(--i) - 7) * 16px), -220%) rotate(340deg) scale(0.7); }
}

/* ---------- Mobile menu button + backdrop (hidden on desktop) ---------- */
.mobile-menu-btn{ display:none; }
.sidebar-backdrop{ display:none; }
.sidebar-close{ display:none; }

@media (max-width: 880px){
  .app{ flex-direction:column; }

  /* Sidebar becomes an off-canvas drawer instead of pushing content down */
  .mobile-menu-btn{
    display:flex; align-items:center; justify-content:center;
    position:fixed; top:14px; left:14px; z-index:60;
    width:40px; height:40px; border-radius:10px;
    background:var(--white); border:1px solid var(--line-strong); box-shadow:var(--shadow-sm);
    font-size:16px; color:var(--ink); cursor:pointer; padding:0;
  }
  .topbar-title{
    display:flex; align-items:center; position:fixed; top:0; left:0; right:0; z-index:55;

    border-bottom:1px solid var(--line-strong); font-family:'Fraunces',serif; font-weight:600; font-size:17px;
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  }
  .sidebar{
    position:fixed; top:0; left:0; width:min(84vw, 320px); height:100%;
    border-right:1px solid var(--line-strong); border-bottom:none;

    z-index:70; box-shadow:var(--shadow-md);
  }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-close{
    display:flex; align-items:center; justify-content:center;
    position:absolute; top:16px; right:16px; width:30px; height:30px;
    border-radius:8px; border:1px solid var(--line-strong); background:var(--white);
    font-size:14px; cursor:pointer; padding:0;
  }
  .sidebar-backdrop.show{
    display:block; position:fixed; inset:0; background:rgba(31,42,68,0.35); z-index:65;
  }
  .main{ padding:84px 16px 40px; }

  .laws-grid, .chart-grid, .row2, .stat-cards{ grid-template-columns:1fr 1fr; }
  .action-add-row{ grid-template-columns:1fr 1fr; }
  .milestone-top{ flex-wrap:wrap; }
  .chain-panel{ flex-wrap:wrap; gap:14px 20px; }

}

@media (max-width: 560px){
  .main{ padding:78px 12px 40px; }
  .laws-grid, .chart-grid, .row2, .stat-cards, .action-add-row{ grid-template-columns:1fr; }

  .habit-header h2{ font-size:21px; }

  .weekday-row, .month-grid{ gap:4px; }
  .day-cell{ min-height:52px; padding:5px; border-radius:6px; }

  .day-frac{ font-size:9px; }
  .weekday-row div{ font-size:9px; }
  .chart-card.full{ grid-column:span 1; }
  .cal-nav .label{ min-width:0; font-size:14px; }
  .stat-card .num{ font-size:22px; }
  .modal-actions{ flex-direction:column; }

}
</style>
</head>
<body>

<button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
<div class="topbar-title" id="topbarTitle">Atomic Ledger</div>
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebarCloseBtn" onclick="closeSidebar()" aria-label="Close menu">✕</button>
    <div class="brand" onclick="goHome();" style="cursor:pointer;">
      <div class="eyebrow">Habit Builder</div>
      <h1>Atomic Ledger</h1>
      <div class="tag">Small actions, logged daily. Built on the four laws of behavior change.</div>
    </div>
    <button class="btn btn-ghost btn-block" style="margin-bottom:8px; justify-content:flex-start;" onclick="goHome();">🏠 Home</button>
    <button class="btn btn-primary btn-block new-habit-btn" onclick="openCreateHabitModal(); closeSidebar();">+ New habit</button>
    <ul class="habit-list" id="habitList"></ul>
    <div class="sidebar-footer">
      <div class="storage-pill" id="storagePill"></div>
      <div class="io-row">
        <button class="btn btn-sm" onclick="exportData()">Export</button>
        <button class="btn btn-sm" onclick="document.getElementById('importFile').click()">Import</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
    </div>
  </aside>

  <main class="main"><div class="container" id="mainContainer"></div></main>
</div>

<div id="modalRoot"></div>
<div id="setupModalRoot"></div>
<div id="celebrationRoot"></div>

<script>
/* ============================= STORAGE ============================= */
const STORAGE_KEY = 'atomicLedgerData_v1';
let usingLocalStorage = true;
let memoryStore = null;

(function testStorage(){
  try{
    const t='__als_test__'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
    usingLocalStorage = true;
  }catch(e){ usingLocalStorage = false; }
})();

function loadData(){
  if(usingLocalStorage){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ usingLocalStorage = false; }
  }
  if(memoryStore) return memoryStore;
  return { habits: [], activeHabitId: null };
}
function saveData(){
  if(usingLocalStorage){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      renderStoragePill();
      return;
    }catch(e){ usingLocalStorage = false; }
  }
  memoryStore = appData;
  renderStoragePill();
}
function renderStoragePill(){
  const el = document.getElementById('storagePill');
  if(!el) return;
  if(usingLocalStorage){
    el.innerHTML = `<span class="storage-dot ok"></span> Saved in this browser`;
  }else{
    el.innerHTML = `<span class="storage-dot warn"></span> Session only — browser storage is blocked here. Export a backup before closing.`;
  }
}
function exportData(){
  const blob = new Blob([JSON.stringify(appData,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'atomic-ledger-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.habits) throw new Error('bad file');
      appData = parsed;
      saveData();
      render();
    }catch(e){ alert('That file could not be read as an Atomic Ledger backup.'); }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

/* ============================= UTIL ============================= */
function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function pad2(n){ return String(n).padStart(2,'0'); }
function formatDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function todayStr(){ return formatDate(new Date()); }
function startOfWeek(d){ const nd=new Date(d); const day=(nd.getDay()+6)%7; nd.setDate(nd.getDate()-day); nd.setHours(0,0,0,0); return nd; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function niceDate(d){ return d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric', year:'numeric'}); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const COLORS = ['#1F2A44','#6E8B74','#DE9F35','#C1533A','#3B6E8F','#8A5FA0'];
const ICONS = ['💪','🏃','📚','🧘','💧','🎨','🎯','🛏️','🥗','✍️'];

/* ============================= STATE ============================= */
let appData = loadData();
if(!appData.habits) appData.habits = [];
/* Normalize legacy data: every habit needs a start date, a milestones list,
   and every action needs the date it started being tracked, so old backups
   keep working the same as before. */
appData.habits.forEach(h=>{
  if(!h.startDate) h.startDate = h.createdAt || todayStr();
  if(!h.createdAt) h.createdAt = h.startDate;
  if(!h.milestones) h.milestones = [];
  if(!h.schedule || !h.schedule.mode) h.schedule = { mode:'daily', days:[], interval:2 };
  (h.actions||[]).forEach(a=>{ if(!a.addedOn) a.addedOn = h.startDate; });
});
let activeTab = 'home';
let editingHabitId = null;
let draftHabit = null;
let setupModalOpen = false;
let homeCarouselIndex = 0;
let homeCarouselTimer = null;
let homeCarouselMoved = false;
let calendarCursor = new Date();
let calendarView = 'month';
let openDayModal = null;
let reportNumericActionId = null;
let reportTimeframe = 'month'; /* 'day' | 'week' | 'month' — drives the Perfection metric, gauge, and trend chart */
function setReportTimeframe(tf){ reportTimeframe = tf; render(); }
let milestoneFormOpen = false;
let celebrationQueue = [];
let celebrationActive = null;
let celebrationTimer = null;

function activeHabit(){ return appData.habits.find(h=>h.id===appData.activeHabitId) || null; }

/* ============================= HABIT LOGIC ============================= */
function habitStartDate(h){ return h.startDate || h.createdAt || todayStr(); }
/* ---- Schedule: which calendar days this habit is actually "due" on ----
   mode 'daily'    → every day is scheduled
   mode 'days'     → only the chosen weekdays (Mon=0 .. Sun=6) are scheduled
   mode 'interval' → every Nth day counting from the habit's start date
                      (interval:2 == alternate day, 7 == weekly, etc.) */
function isScheduledDay(h, dateStr){
  const sched = h.schedule || { mode:'daily' };
  const start = parseDate(habitStartDate(h));
  const d = parseDate(dateStr);
  if(d < start) return false;
  if(sched.mode==='days'){
    const idx = (d.getDay()+6)%7;
    return (sched.days||[]).includes(idx);
  }
  if(sched.mode==='interval'){
    const n = Math.max(2, Number(sched.interval)||2);
    const diff = Math.round((d - start)/86400000);
    return diff>=0 && diff % n === 0;
  }
  return true; /* daily, or unrecognized mode falls back to every day */
}
function scheduledDatesInRange(h, fromDs, toDs){
  const from = parseDate(fromDs), to = parseDate(toDs);
  const list = [];
  let d = new Date(from);
  while(d<=to){ const ds=formatDate(d); if(isScheduledDay(h,ds)) list.push(ds); d = addDays(d,1); }
  return list;
}
function scheduleSummary(h){
  const sched = h.schedule || { mode:'daily' };
  if(sched.mode==='days'){
    const names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const chosen = (sched.days||[]).slice().sort().map(i=>names[i]);
    return chosen.length ? chosen.join(', ') : 'No days chosen yet';
  }
  if(sched.mode==='interval') return `Every ${Math.max(2,Number(sched.interval)||2)} days`;
  return 'Every day';
}
function actionActiveOn(a, dateStr){ return !a.addedOn || a.addedOn <= dateStr; }
/* Only the actions that had actually been added yet, as of dateStr. This is
   what keeps old logged days looking correct after a new action is added
   later — history is judged by what existed back then, not by today's list. */
function activeActionsOn(h, dateStr){ return h.actions.filter(a=>actionActiveOn(a, dateStr)); }
function actionValueMet(a, v){
  if(a.type==='checkbox') return v===true;
  if(a.type==='identity') return v===true;
  if(a.type==='number') return typeof v==='number' && v>0;
  if(a.type==='text') return typeof v==='string' && v.trim().length>0;
  return false;
}
function isDayComplete(habit, dateStr){
  const log = habit.logs[dateStr];
  if(!log) return false;
  if(habit.actions.length===0) return Object.values(log).some(Boolean);
  const acts = activeActionsOn(habit, dateStr);
  if(acts.length===0) return false;
  return acts.every(a=>actionValueMet(a, log[a.id]));
}
function isDayPartial(habit, dateStr){
  const log = habit.logs[dateStr];
  if(!log) return false;
  const acts = activeActionsOn(habit, dateStr);
  const checkList = acts.length ? acts : habit.actions;
  const any = checkList.some(a=>actionValueMet(a, log[a.id]));
  return any && !isDayComplete(habit, dateStr);
}
/* Any logged activity at all — a single sub-action, or an Identity Action
   checked on its own — is enough to keep the streak alive. This is
   deliberately looser than isDayComplete, which still requires every
   sub-action to be met and continues to drive the calendar's "complete"
   styling, the weekday chart, and month stats. */
function isDayActive(habit, dateStr){
  const log = habit.logs[dateStr];
  if(!log) return false;
  const acts = activeActionsOn(habit, dateStr);
  const checkList = acts.length ? acts : habit.actions;
  if(checkList.length===0) return Object.values(log).some(Boolean);
  return checkList.some(a=>actionValueMet(a, log[a.id]));
}
function computeStreak(habit){
  /* Streaks are counted against SCHEDULED days only — an off-schedule
     "rest day" neither extends nor breaks the chain. A day preserves the
     streak the moment ANY sub-action (or Identity Action) is logged —
     it no longer requires the whole day to be complete. */
  const today = todayStr();
  const scheduled = scheduledDatesInRange(habit, habitStartDate(habit), today);

  let longest=0, run=0;
  for(const ds of scheduled){
    if(isDayActive(habit, ds)){ run++; longest = Math.max(longest, run); }
    else run = 0;
  }

  let cur = 0;
  for(let i=scheduled.length-1; i>=0; i--){
    const ds = scheduled[i];
    if(isDayActive(habit, ds)){ cur++; continue; }
    if(ds===today) continue; /* today's still open — don't break the chain for it */
    break;
  }
  return { current: cur, longest };
}
function setLogValue(habitId, dateStr, actionId, value){
  const h = appData.habits.find(x=>x.id===habitId);
  if(!h) return;
  const baseline = captureMilestoneBaseline(h);
  if(!h.logs[dateStr]) h.logs[dateStr] = {};
  h.logs[dateStr][actionId] = value;

  /* Auto-completion: logging real effort on any standard sub-action means
     you showed up, so any Identity Action(s) active that day get checked
     automatically. This only fires forward (logging effort implies
     showing up); it never auto-unchecks an Identity Action, since that
     remains under the user's manual control. */
  const action = h.actions.find(a=>a.id===actionId);
  if(action && action.type!=='identity' && actionValueMet(action, value)){
    activeActionsOn(h, dateStr).filter(a=>a.type==='identity').forEach(idAction=>{
      if(h.logs[dateStr][idAction.id]!==true) h.logs[dateStr][idAction.id] = true;
    });
  }

  saveData();
  checkForNewMilestones(h, baseline);
  render();
}
function adjustLogValue(habitId, dateStr, actionId, delta){
  const h = appData.habits.find(x=>x.id===habitId);
  const cur = (h.logs[dateStr] && h.logs[dateStr][actionId]) || 0;
  setLogValue(habitId, dateStr, actionId, Math.max(0, cur + delta));
}
function clearDay(habitId, dateStr){
  const h = appData.habits.find(x=>x.id===habitId);
  if(h && h.logs[dateStr]){ delete h.logs[dateStr]; saveData(); render(); }
}

/* ---------- Habit summary carousel: autoplay + drag/swipe + dots/arrows ---------- */
function carouselCount(){ return appData.habits.length; }
function applyCarouselTransform(animate){
  const track = document.getElementById('homeCarouselTrack');
  if(!track) return;
  track.style.transition = animate ? 'transform .45s cubic-bezier(.4,0,.2,1)' : 'none';
  track.style.transform = `translateX(${-homeCarouselIndex*100}%)`;
}
function updateCarouselDots(){
  document.querySelectorAll('.carousel-dot').forEach((d,i)=> d.classList.toggle('active', i===homeCarouselIndex));
}
function goToCarouselSlide(i){
  const n = carouselCount();
  if(n<=0) return;
  homeCarouselIndex = ((i % n) + n) % n;
  applyCarouselTransform(true);
  updateCarouselDots();
  restartCarouselAutoplay();
}
function carouselNext(){ goToCarouselSlide(homeCarouselIndex+1); }
function carouselPrev(){ goToCarouselSlide(homeCarouselIndex-1); }
function startCarouselAutoplay(){
  clearInterval(homeCarouselTimer);
  if(carouselCount() <= 1) return;
  homeCarouselTimer = setInterval(()=>{ goToCarouselSlide(homeCarouselIndex+1); }, 4800);
}
function stopCarouselAutoplay(){ clearInterval(homeCarouselTimer); }
function restartCarouselAutoplay(){ startCarouselAutoplay(); }
function bindHomeCarousel(){
  const n = carouselCount();
  homeCarouselIndex = n ? Math.min(homeCarouselIndex, n-1) : 0;
  applyCarouselTransform(false);
  updateCarouselDots();
  const viewport = document.getElementById('homeCarouselViewport');
  const track = document.getElementById('homeCarouselTrack');
  if(!viewport || !track || n<=1) return;

  startCarouselAutoplay();
  viewport.addEventListener('mouseenter', stopCarouselAutoplay);
  viewport.addEventListener('mouseleave', startCarouselAutoplay);

  let startX=0, dx=0, dragging=false;
  viewport.addEventListener('pointerdown', e=>{
    dragging = true; homeCarouselMoved = false; startX = e.clientX; dx = 0;
    stopCarouselAutoplay(); track.style.transition = 'none';
    try{ viewport.setPointerCapture(e.pointerId); }catch(err){}
  });
  viewport.addEventListener('pointermove', e=>{
    if(!dragging) return;
    dx = e.clientX - startX;
    if(Math.abs(dx) > 6) homeCarouselMoved = true;
    const pct = (dx / viewport.getBoundingClientRect().width) * 100;
    track.style.transform = `translateX(${-homeCarouselIndex*100 + pct}%)`;
  });
  const endDrag = ()=>{
    if(!dragging) return;
    dragging = false;
    const threshold = viewport.getBoundingClientRect().width * 0.16;
    if(dx < -threshold) goToCarouselSlide(homeCarouselIndex+1);
    else if(dx > threshold) goToCarouselSlide(homeCarouselIndex-1);
    else{ applyCarouselTransform(true); restartCarouselAutoplay(); }
    setTimeout(()=>{ homeCarouselMoved = false; }, 50);
  };
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);
}

function saveHabit(){
  if(!draftHabit.name.trim()){ alert('Name the habit before saving.'); document.getElementById('f-name').focus(); return; }
  if(!draftHabit.startDate) draftHabit.startDate = todayStr();
  if(draftHabit.schedule?.mode==='days' && (!draftHabit.schedule.days || !draftHabit.schedule.days.length)){ alert('Pick at least one day of the week.'); return; }
  if(editingHabitId){
    const idx = appData.habits.findIndex(h=>h.id===editingHabitId);
    /* Spread the existing saved habit first, then the edited draft on top —
       the draft already carries a full clone of logs and milestones taken
       when Edit was opened, so nothing gets dropped here, it only merges
       in whatever changed (like the newly added action). */
    appData.habits[idx] = { ...appData.habits[idx], ...draftHabit };
  }else{
    const h = { ...draftHabit, id: uid(), createdAt: draftHabit.startDate, logs: {}, milestones: draftHabit.milestones || [] };

function renderMonthGrid(h){
  const year = calendarCursor.getFullYear(), month = calendarCursor.getMonth();
  const first = new Date(year, month, 1);
  const gridStart = startOfWeek(first);
  const today = todayStr();
  const startDate = parseDate(habitStartDate(h));
  const weekdayRow = `<div class="weekday-row">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div>${w}</div>`).join('')}</div>`;
  let cells = '';
  for(let i=0;i<42;i++){
    const d = addDays(gridStart, i);
    const ds = formatDate(d);
    const inMonth = d.getMonth()===month;
    const isToday = ds===today;
    const isFuture = d > new Date(new Date().setHours(23,59,59,999));
    const beforeStart = d < startDate;
    const scheduled = !beforeStart && isScheduledDay(h, ds);
    const complete = !beforeStart && scheduled && isDayComplete(h, ds);
    const partial = !complete && !beforeStart && scheduled && isDayPartial(h, ds);
    const log = h.logs[ds];
    const acts = activeActionsOn(h, ds);
    const doneCount = log ? acts.filter(a=>actionValueMet(a, log[a.id])).length : 0;
    const cls = ['day-cell'];
    if(!inMonth) cls.push('muted');
    if(isToday) cls.push('today');
    if(isFuture) cls.push('future');
    if(beforeStart) cls.push('before-start');
    if(!beforeStart && !scheduled) cls.push('off-schedule');
    if(complete) cls.push('complete'); else if(partial) cls.push('partial');
    const frac = beforeStart ? '—' : !scheduled ? 'rest' : doneCount+'/'+acts.length;
    cells += `<div class="${cls.join(' ')}" onclick="openDay('${ds}')">
      <div class="day-num">${d.getDate()}</div>
      <div class="day-frac">${frac}</div>
    </div>`;
    if(i===41 && d < addDays(gridStart, 34) ) { /* keep 6 rows regardless */ }
  }
  return weekdayRow + `<div class="month-grid">${cells}</div>`;
}

/* ============================= REPORT TAB ============================= */
function monthStats(h, year, month){
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const start = parseDate(habitStartDate(h));
  let complete=0, partial=0, missed=0, considered=0;
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(year, month, day);
    if(d > today) continue;
    if(d < start) continue; /* don't count days before the habit even started */
    const ds = formatDate(d);
    if(!isScheduledDay(h, ds)) continue; /* rest days don't count as missed */
    considered++;
    if(isDayComplete(h, ds)) complete++;
    else if(isDayPartial(h, ds)) partial++;
    else missed++;
  }
  return { complete, partial, missed, considered };
}
function weekdayCompletion(h){
  const counts = Array(7).fill(0), totals = Array(7).fill(0);
  const today = new Date(); today.setHours(0,0,0,0);
  const created = parseDate(habitStartDate(h));
  let d = new Date(created);
  while(d <= today){
    const ds = formatDate(d);
    if(isScheduledDay(h, ds)){
      const idx = (d.getDay()+6)%7;
      totals[idx]++;
      if(isDayComplete(h, ds)) counts[idx]++;
    }
    d = addDays(d,1);
  }
  return counts.map((c,i)=> totals[i] ? Math.round((c/totals[i])*100) : 0);
}
function numericActions(h){ return h.actions.filter(a=>a.type==='number'); }

/* ---- Perfection: sub-action-level completion, not day-level averaging ----
   A day with 2 sub-actions where only 1 was done contributes 1/2, not 0.
   This keeps multi-action habits from being punished (or flattered) by
   rounding every day down to a single complete/incomplete bit. */
function dayPerfection(h, ds){
  const today = todayStr();
  const start = habitStartDate(h);
  if(ds > today || ds < start || !isScheduledDay(h, ds)) return null;
  const log = h.logs[ds] || {};
  if(h.actions.length===0){
    /* No sub-actions defined yet — fall back to the old binary read so
       brand-new habits still show something sensible. */
    const any = Object.values(log).some(Boolean);
    return { completed: any?1:0, total: 1 };
  }
  /* Identity Actions track "showed up," not effort — they're excluded from
     the Perfection Rate, which is scored only against standard,
     quantitative/effort-based sub-actions. */
  const acts = activeActionsOn(h, ds).filter(a=>a.type!=='identity');
  if(!acts.length) return null;
  let completed = 0;
  acts.forEach(a=>{ if(actionValueMet(a, log[a.id])) completed++; });
  return { completed, total: acts.length };
}
function perfectionRangeStats(h, fromDs, toDs){
  const from = parseDate(fromDs), to = parseDate(toDs);
  let completed=0, total=0, completeDays=0, partialDays=0, missedDays=0, consideredDays=0;
  let d = new Date(from);
  while(d <= to){
    const ds = formatDate(d);
    const p = dayPerfection(h, ds);
    if(p){
      completed += p.completed; total += p.total; consideredDays++;
      if(p.completed===p.total) completeDays++;
      else if(p.completed>0) partialDays++;
      else missedDays++;
    }
    d = addDays(d,1);
  }
  return { completed, total, completeDays, partialDays, missedDays, consideredDays,
    percent: total ? Math.round((completed/total)*100) : 0 };
}
function timeframeRange(timeframe){
  const now = new Date();
  if(timeframe==='day'){ const ds = todayStr(); return [ds, ds]; }
  if(timeframe==='week'){ const s = startOfWeek(now); return [formatDate(s), formatDate(addDays(s,6))]; }
  const y=now.getFullYear(), m=now.getMonth();
  return [formatDate(new Date(y,m,1)), formatDate(new Date(y,m+1,0))];
}
function timeframeLabel(timeframe){
  return timeframe==='day' ? 'Today' : timeframe==='week' ? 'This week' : 'This month';
}
/* Perfection Score (%) vs Date — granularity follows the selected timeframe:
   day-by-day for "Day", week-by-week for "Week", month-by-month for "Month". */
function perfectionSeries(h, timeframe){
  const today = new Date(); today.setHours(0,0,0,0);
  const start = parseDate(habitStartDate(h));
  const labels = [], values = [];
  if(timeframe==='day'){
    const dates = [];
    let d = new Date(today);
    while(dates.length<30 && d>=start){
      const ds = formatDate(d);
      if(isScheduledDay(h,ds)) dates.unshift(ds);
      d = addDays(d,-1);
    }
    dates.forEach(ds=>{
      const p = dayPerfection(h, ds);
      labels.push(parseDate(ds).toLocaleDateString(undefined,{month:'short', day:'numeric'}));
      values.push(p && p.total ? Math.round((p.completed/p.total)*100) : 0);
    });
  } else if(timeframe==='week'){
    let weekStart = startOfWeek(today);
    const weeks = [];
    for(let i=0;i<10;i++){
      if(weekStart < startOfWeek(start) && i>0) break;
      weeks.unshift(new Date(weekStart));
      weekStart = addDays(weekStart,-7);
    }
    weeks.forEach(ws=>{
      const we = addDays(ws,6);
      const stats = perfectionRangeStats(h, formatDate(ws), formatDate(we));
      labels.push(ws.toLocaleDateString(undefined,{month:'short', day:'numeric'}));
      values.push(stats.percent);
    });
  } else {
    let cursor = new Date(today.getFullYear(), today.getMonth(), 1);
    const months = [];
    for(let i=0;i<6;i++){
      if(cursor < new Date(start.getFullYear(), start.getMonth(), 1) && i>0) break;
      months.unshift(new Date(cursor));
      cursor = new Date(cursor.getFullYear(), cursor.getMonth()-1, 1);
    }
    months.forEach(ms=>{
      const me = new Date(ms.getFullYear(), ms.getMonth()+1, 0);
      const stats = perfectionRangeStats(h, formatDate(ms), formatDate(me));
      labels.push(ms.toLocaleDateString(undefined,{month:'short', year:'2-digit'}));
      values.push(stats.percent);
    });
  }
  return { labels, values };
}
function trendData(h, actionId){
  /* Walk backward collecting only SCHEDULED days — an alternate-day (or
     weekly, etc.) habit shouldn't show a sawtooth of zeros on the days
     it was never due in the first place. */
  const today = new Date(); today.setHours(0,0,0,0);
  const start = parseDate(habitStartDate(h));
  const dates = [];
  let d = new Date(today);
  while(dates.length<30 && d>=start){
    const ds = formatDate(d);
    if(isScheduledDay(h, ds)) dates.unshift(ds);
    d = addDays(d,-1);
  }
  const labels = dates.map(ds=>parseDate(ds).toLocaleDateString(undefined,{month:'short', day:'numeric'}));
  const values = dates.map(ds=>{
    const log = h.logs[ds];
    return log && typeof log[actionId]==='number' ? log[actionId] : 0;
  });
  return { labels, values };
}

/* Circular Perfection gauge. Renders at 0% initially (dashoffset = full

      <div class="row"><span class="dot" style="background:var(--sage)"></span>Complete days <span class="frac">${stats.completeDays}</span></div>
      <div class="row"><span class="dot" style="background:var(--rust)"></span>Missed days <span class="frac">${stats.missedDays}</span></div>

function renderBarChart(values){
  const cols = values.map((v,i)=>{

function renderLineChartSVG(labels, values, opts){
  opts = opts || {};
  const w=560, h=190, padL=34, padR=10, padTop=14, padBottom=26;
  const fixedMax = opts.fixedMax; /* e.g. 100 for percent charts */
  const maxRaw = fixedMax!=null ? fixedMax : Math.max(...values, 0);
  const max = maxRaw > 0 ? maxRaw : 1;
  const n = values.length;
  const stepX = (w - padL - padR) / Math.max(n-1,1);
  const points = values.map((v,i)=>{
    const x = padL + i*stepX;
    const y = h - padBottom - (v/max)*(h - padTop - padBottom);
    return [x,y];
  });
  const pathD = points.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L${points[n-1][0].toFixed(1)},${h-padBottom} L${points[0][0].toFixed(1)},${h-padBottom} Z`;
  const dotEvery = Math.max(Math.ceil(n/10),1);
  const dots = points.map((p,i)=> (i%dotEvery===0 || i===n-1) ? `<circle class="line-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--ink)"></circle>` : '').join('');
  const ticks = [0,0.25,0.5,0.75,1];
  const gridlines = ticks.map(f=>{
    const y = padTop + f*(h-padTop-padBottom);
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="rgba(31,42,68,0.08)" stroke-width="1"/>`;
  }).join('');
  const yLabels = ticks.map(f=>{
    const y = padTop + f*(h-padTop-padBottom);
    const val = Math.round(max*(1-f));
    return `<text x="${(padL-8).toFixed(1)}" y="${(y+3).toFixed(1)}" font-size="9" fill="var(--ink-soft)" text-anchor="end" font-family="IBM Plex Mono, monospace">${val}${fixedMax!=null?'%':''}</text>`;
  }).join('');
  const axisLine = `<line x1="${padL}" y1="${padTop}" x2="${padL}" y2="${h-padBottom}" stroke="var(--line-strong)" stroke-width="1"/>`;
  const labelEvery = Math.max(Math.ceil(n/6),1);
  const xLabels = labels.map((l,i)=> (i%labelEvery===0 || i===n-1) ? `<text x="${points[i][0].toFixed(1)}" y="${h-6}" font-size="9" fill="var(--ink-soft)" text-anchor="middle" font-family="IBM Plex Mono, monospace">${l}</text>` : '').join('');
  return `<div class="line-chart-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    ${gridlines}
    ${axisLine}
    <path class="line-area" d="${areaD}" fill="rgba(31,42,68,0.08)" stroke="none"/>
    <path class="line-path" d="${pathD}" fill="none" stroke="var(--ink)" stroke-width="2"/>
    ${dots}
    ${yLabels}
    ${xLabels}
  </svg></div>`;
}
/* Replays every time the Report tab is (re)rendered — including plain tab
   switches, since render() rebuilds the tab's DOM from scratch each time. */
function initReportAnimations(){
  const container = document.getElementById('mainContainer');
  if(!container) return;

  container.querySelectorAll('.gauge-fill').forEach(circle=>{
    const target = circle.getAttribute('data-target-offset');
    requestAnimationFrame(()=>{ circle.style.strokeDashoffset = target; });
  });
  container.querySelectorAll('.gauge-percent').forEach(el=>{
    const target = Number(el.getAttribute('data-target'))||0;
    const duration = 1150, start = performance.now();
    function step(now){
      const t = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-t, 3);
      el.textContent = Math.round(target*eased) + '%';
      if(t<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });

  container.querySelectorAll('.bar-fill').forEach(bar=>{
    const target = bar.getAttribute('data-target-height');
    requestAnimationFrame(()=>{ bar.style.height = target + '%'; });
  });

  container.querySelectorAll('.line-path').forEach(path=>{
    const len = path.getTotalLength();
    path.style.transition = 'none';
    path.style.strokeDasharray = len + ' ' + len;
    path.style.strokeDashoffset = len;
    path.getBoundingClientRect(); /* force reflow before re-enabling transition */
    path.style.transition = '';
    requestAnimationFrame(()=> requestAnimationFrame(()=>{ path.style.strokeDashoffset = 0; }));
  });
  container.querySelectorAll('.line-area').forEach(el=> requestAnimationFrame(()=> el.classList.add('in')));
  container.querySelectorAll('.line-dot').forEach((el,i)=>{
    setTimeout(()=> el.classList.add('in'), 1150);
  });
}

/* ============================= MILESTONES ============================= */
function actionTotal(h, actionId){
  let sum = 0;
  for(const ds in h.logs){ const v = h.logs[ds][actionId]; if(typeof v==='number') sum += v; }
  return sum;
}
function actionBestDay(h, actionId){
  let best = 0, bestDs = null;
  for(const ds of Object.keys(h.logs).sort()){
    const v = h.logs[ds][actionId];
    if(typeof v==='number' && v>best){ best=v; bestDs=ds; }
  }
  return { best, bestDs };
}
function streakMilestoneAchievedDate(h, target){
  const doneDates = Object.keys(h.logs).filter(ds=>isDayComplete(h,ds)).sort();
  let run=0, prev=null;
  for(const ds of doneDates){
    if(prev && (parseDate(ds)-parseDate(prev))/86400000===1) run++; else run=1;
    if(run>=target) return ds;
    prev = ds;
  }
  return null;
}
function totalMilestoneAchievedDate(h, actionId, target){
  let sum = 0;
  for(const ds of Object.keys(h.logs).sort()){
    const v = h.logs[ds][actionId];
    if(typeof v==='number') sum += v;
    if(sum>=target) return ds;
  }
  return null;
}
function singleMilestoneAchievedDate(h, actionId, target){
  for(const ds of Object.keys(h.logs).sort()){
    const v = h.logs[ds][actionId];
    if(typeof v==='number' && v>=target) return ds;
  }
  return null;
}
function milestoneProgress(h, m){
  if(m.type==='streak') return { value: computeStreak(h).longest, achievedOn: streakMilestoneAchievedDate(h, m.target) };
  if(m.type==='total') return { value: actionTotal(h, m.actionId), achievedOn: totalMilestoneAchievedDate(h, m.actionId, m.target) };
  if(m.type==='single') return { value: actionBestDay(h, m.actionId).best, achievedOn: singleMilestoneAchievedDate(h, m.actionId, m.target) };
  return { value: 0, achievedOn: null };
}
/* ---- Celebration: snapshot record-holding stats before a log change,
   then diff against the same stats after, so every NEW record or
   newly-crossed milestone target triggers exactly one celebration. ---- */
function captureMilestoneBaseline(h){
  const streak = computeStreak(h);
  const bestDays = {};
  numericActions(h).forEach(a=>{ bestDays[a.id] = actionBestDay(h, a.id).best; });
  const customs = {};
  (h.milestones||[]).forEach(m=>{ customs[m.id] = !!milestoneProgress(h, m).achievedOn; });
  return { longest: streak.longest, bestDays, customs };
}
function checkForNewMilestones(h, baseline){
  const streak = computeStreak(h);
  if(baseline.longest > 0 && streak.longest > baseline.longest){
    queueCelebration({ icon:'🔥', title:'New longest streak!', detail:`${streak.longest} day${streak.longest===1?'':'s'} in a row on "${h.name}"` });
  }
  numericActions(h).forEach(a=>{
    const best = actionBestDay(h, a.id).best;
    const prevBest = baseline.bestDays[a.id] || 0;
    if(prevBest > 0 && best > prevBest){
      queueCelebration({ icon:'⭐', title:'New personal best!', detail:`${best}${a.unit?' '+a.unit:''} of "${a.label}" in a single day` });
    }
  });
  (h.milestones||[]).forEach(m=>{
    const achieved = !!milestoneProgress(h, m).achievedOn;
    if(achieved && !baseline.customs[m.id]){
      queueCelebration({ icon:'🏆', title:'Milestone reached!', detail: m.label });
    }
  });
}
function queueCelebration(e){
  celebrationQueue.push(e);
  if(!celebrationActive) showNextCelebration();
}
function showNextCelebration(){
  clearTimeout(celebrationTimer);
  if(celebrationQueue.length===0){ celebrationActive=null; renderCelebration(); return; }
  celebrationActive = celebrationQueue.shift();
  renderCelebration();
  celebrationTimer = setTimeout(dismissCelebration, 3400);
}
function dismissCelebration(){
  clearTimeout(celebrationTimer);
  const root = document.getElementById('celebrationRoot');
  const card = root && root.querySelector('.celebrate-card');
  if(card){ card.classList.add('leaving'); setTimeout(showNextCelebration, 190); }
  else showNextCelebration();
}
function renderCelebration(){
  const root = document.getElementById('celebrationRoot');
  if(!root) return;
  if(!celebrationActive){ root.innerHTML=''; return; }
  const e = celebrationActive;
  const confetti = Array.from({length:14}).map((_,i)=>`<span class="confetto c${i%6}" style="--i:${i}"></span>`).join('');
  root.innerHTML = `<div class="celebrate-overlay" onclick="dismissCelebration()">
    <div class="celebrate-card">
      <div class="confetti">${confetti}</div>
      <div class="celebrate-icon">${e.icon}</div>
      <div class="celebrate-title">${esc(e.title)}</div>
      <div class="celebrate-detail">${esc(e.detail)}</div>
      <button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); dismissCelebration()">Nice!</button>
    </div>
  </div>`;
}
function addMilestone(habitId, milestone){
  const h = appData.habits.find(x=>x.id===habitId);
  if(!h) return;
  if(!h.milestones) h.milestones = [];
  h.milestones.push(milestone);
  saveData(); render();
}
function deleteMilestone(habitId, id){
  const h = appData.habits.find(x=>x.id===habitId);
  if(!h) return;
  h.milestones = (h.milestones||[]).filter(m=>m.id!==id);
  saveData(); render();
}
function toggleMilestoneActionField(){
  const type = document.getElementById('m-type')?.value;
  const field = document.getElementById('m-action-field');
  if(field) field.style.display = (type==='streak') ? 'none' : '';
}
function addMilestoneFromForm(habitId){
  const type = document.getElementById('m-type').value;
  const target = Number(document.getElementById('m-target').value);
  let label = document.getElementById('m-label').value.trim();
  const actionId = (type!=='streak') ? document.getElementById('m-action')?.value : null;
  if(!target || target<=0){ alert('Set a target greater than 0.'); return; }
  if(type!=='streak' && !actionId){ alert('Pick a number action for this milestone.'); return; }
  const h = appData.habits.find(x=>x.id===habitId);
  const action = actionId ? h.actions.find(a=>a.id===actionId) : null;
  if(!label){
    if(type==='streak') label = `${target}-day streak`;
    else if(type==='total') label = `${target} total ${(action && (action.unit||action.label)) || ''}`.trim();
    else label = `${target}${action && action.unit ? ' '+action.unit : ''} in a single day`.trim();
  }
  milestoneFormOpen = false;
  addMilestone(habitId, { id: uid(), type, actionId, target, label });
}
function renderMilestoneForm(h, nums){
  return `<div class="form-card" style="margin-top:14px;">
    <div class="row2">
      <div class="field">
        <label>Milestone type</label>
        <select id="m-type" onchange="toggleMilestoneActionField()">
          <option value="streak">Longest streak (days)</option>
          <option value="total" ${!nums.length?'disabled':''}>Total accumulated (a number action)</option>
          <option value="single" ${!nums.length?'disabled':''}>Best single day (a number action)</option>
        </select>
      </div>
      <div class="field" id="m-action-field" style="display:none;">
        <label>Which action?</label>
        <select id="m-action">${nums.map(a=>`<option value="${a.id}">${esc(a.label)}</option>`).join('')}</select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Target</label>
        <input type="number" min="1" id="m-target" placeholder="e.g. 30">
      </div>
      <div class="field">
        <label>Label (optional)</label>
        <input type="text" id="m-label" placeholder="e.g. 1000 pushups completed">
      </div>
    </div>
    <div class="form-footer">
      <button class="btn btn-primary btn-sm" onclick="addMilestoneFromForm('${h.id}')">Save milestone</button>
      <button class="btn btn-sm" onclick="milestoneFormOpen=false; render();">Cancel</button>
    </div>
  </div>`;
}
function renderRecordsSection(h){
  const streak = computeStreak(h);
  const nums = numericActions(h);
  const streakCard = `<div class="milestone-card ${streak.longest>0?'achieved':''} record-card">
    <div class="milestone-top"><div class="milestone-label">🔥 Longest streak</div></div>
    <div class="milestone-meta">${streak.longest} day${streak.longest===1?'':'s'} in a row${streak.longest?' · your best so far':' · complete a day to start'}</div>
  </div>`;
  const bestCards = nums.map(a=>{
    const { best, bestDs } = actionBestDay(h, a.id);
    return `<div class="milestone-card ${best>0?'achieved':''} record-card">
      <div class="milestone-top"><div class="milestone-label">⭐ Best day — ${esc(a.label)}</div></div>
      <div class="milestone-meta">${best>0 ? `${best}${a.unit?' '+esc(a.unit):''}${bestDs?' · '+niceDate(parseDate(bestDs)):''}` : 'No days logged yet'}</div>
    </div>`;
  }).join('');
  return `<div class="form-section-title" style="margin-top:0;">Personal records</div>
  <div class="hint" style="margin-bottom:12px;">Built in automatically for every habit — no setup needed.</div>
  <div class="records-grid">${streakCard}${bestCards}</div>`;
}
function renderMilestonesTab(h){
  const nums = numericActions(h);
  const list = (h.milestones||[]).map(m=>{
    const prog = milestoneProgress(h, m);
    const pct = m.target ? Math.min(100, Math.round((prog.value / m.target)*100)) : 0;
    const achieved = !!prog.achievedOn;
    const action = m.actionId ? h.actions.find(a=>a.id===m.actionId) : null;
    const unit = action?.unit || (m.type==='streak' ? 'days' : '');
    return `<div class="milestone-card ${achieved?'achieved':''}">
      <div class="milestone-top">
        <div class="milestone-label">${achieved?'🏆 ':''}${esc(m.label)}</div>
        <button class="btn btn-ghost btn-sm" onclick="deleteMilestone('${h.id}','${m.id}')">Remove</button>
      </div>
      <div class="milestone-bar"><div class="milestone-bar-fill" style="width:${pct}%"></div></div>
      <div class="milestone-meta">${Math.min(prog.value,m.target)} / ${m.target}${unit?' '+esc(unit):''} ${achieved ? '· achieved '+niceDate(parseDate(prog.achievedOn)) : ''}</div>
    </div>`;
  }).join('');

  return `${renderRecordsSection(h)}
  <div class="milestones-divider"></div>
  <div class="form-section-title" style="margin-top:0;">Custom milestones</div>
  <div class="milestones-wrap">
    ${list || '<div class="report-empty">No milestones yet. Set a target — a longest streak, a total, or a personal best — and watch it fill up.</div>'}
    ${milestoneFormOpen ? renderMilestoneForm(h, nums) : `<button class="btn btn-primary btn-sm" style="align-self:flex-start;" onclick="milestoneFormOpen=true; render();">+ Add milestone</button>`}
  </div>`;
}

function renderReportTab(h){
  const streak = computeStreak(h);
  const totalLogged = Object.keys(h.logs).length;
  const nums = numericActions(h);
  if(!reportNumericActionId || !nums.find(a=>a.id===reportNumericActionId)) reportNumericActionId = nums[0]?.id || null;
  const wk = weekdayCompletion(h);
  const selectedAction = nums.find(a=>a.id===reportNumericActionId);
  const trend = selectedAction ? trendData(h, reportNumericActionId) : null;
  const peak = trend ? Math.max(...trend.values) : 0;

  const [fromDs, toDs] = timeframeRange(reportTimeframe);
  const pStats = perfectionRangeStats(h, fromDs, toDs);
  const perfSeries = perfectionSeries(h, reportTimeframe);

  const tfBtn = (tf, label) => `<button class="${tf===reportTimeframe?'active':''}" onclick="setReportTimeframe('${tf}')">${label}</button>`;

  return `<div class="stat-cards">
    <div class="stat-card"><div class="num">${streak.current}</div><div class="lbl">Current streak</div></div>
    <div class="stat-card"><div class="num">${streak.longest}</div><div class="lbl">Longest streak</div></div>
    <div class="stat-card"><div class="num">${pStats.percent}%</div><div class="lbl">Perfection · ${esc(timeframeLabel(reportTimeframe))}</div></div>
    <div class="stat-card"><div class="num">${totalLogged}</div><div class="lbl">Days logged, ever</div></div>
  </div>
  <div class="chart-grid">
    <div class="chart-card">
      <div class="gauge-toolbar">
        <div>
          <h4 style="margin-bottom:2px;">Perfection</h4>
          <div class="chart-sub" style="margin-bottom:0;">Completed sub-actions ÷ expected sub-actions · excludes Identity Actions</div>
        </div>
        <div class="view-toggle">${tfBtn('day','Day')}${tfBtn('week','Week')}${tfBtn('month','Month')}</div>
      </div>
      ${pStats.total ? renderPerfectionGauge(pStats) : '<div class="report-empty">Log a few days to see this chart.</div>'}
    </div>
    <div class="chart-card">
      <h4>Weekday pattern</h4>
      <div class="chart-sub">Completion rate by day of week, all-time</div>
      ${renderBarChart(wk)}
    </div>
    <div class="chart-card full">
      <h4>Perfection trend</h4>
      <div class="chart-sub">Perfection score (%) vs. date${reportTimeframe==='day'?', daily':reportTimeframe==='week'?', weekly':', monthly'}</div>
      ${perfSeries.values.length ? renderLineChartSVG(perfSeries.labels, perfSeries.values, {fixedMax:100}) : '<div class="report-empty">Log a few days to see this chart.</div>'}
    </div>
    <div class="chart-card full">
      <h4 style="display:inline;">Action trend</h4>
      ${nums.length>1 ? `<select class="chart-select" style="float:right;" onchange="reportNumericActionId=this.value; render();">
        ${nums.map(a=>`<option value="${a.id}" ${a.id===reportNumericActionId?'selected':''}>${esc(a.label)}</option>`).join('')}
      </select>` : ''}
      <div class="chart-sub">${nums.length ? `Last ${trend ? trend.labels.length : 30} scheduled days${selectedAction && selectedAction.unit ? ' · peak '+peak+' '+esc(selectedAction.unit) : ''}` : 'Add a number action (like reps, minutes, or pages) to see a trend line here.'}</div>
      ${trend ? renderLineChartSVG(trend.labels, trend.values) : ''}
    </div>
  </div>`;
}

/* ============================= INIT ============================= */
render();
</script>
